[project]
name = "prednfl"
version = "0.1.0"
description = "NFL game winner backtesting scaffold"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "nflreadpy>=0.1.5",
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "scikit-learn>=1.3.0",
  "pyarrow>=14.0.0",
]

[project.scripts]
prednfl = "prednfl.cli:main"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]
